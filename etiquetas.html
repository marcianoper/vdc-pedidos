<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Etiqueta Menudo Premium 200x80mm</title>

<style>
  @page{
    size: 200mm 80mm;
    margin:0;
  }

  *{
    box-sizing:border-box;
  }

  html, body{
    margin:0;
    padding:0;
    width:200mm;
    height:80mm;
    background:#fff;
    font-family: Arial, Helvetica, sans-serif;
  }

  .etiqueta{
    width:200mm;
    height:80mm;
    border:3px solid #111;
    display:grid;
    grid-template-columns: 55mm 1fr 60mm;
    overflow:hidden;
    position:relative;
  }

  /* =======================
     BLOQUE IZQUIERDO
  ========================*/
  .lado-logo{
    padding:6mm 4mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:38mm;
    max-height:22mm;
    object-fit:contain;
    margin-bottom:4mm;
  }

  .empresa{
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    line-height:1.1;
    letter-spacing:.3px;
  }

  /* =======================
     CENTRO
  ========================*/
  .centro{
    border-left:2px solid #111;
    border-right:2px solid #111;
    padding:5mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
  }

  .tipo{
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:2mm;
  }

  .titulo{
    font-size:28px;
    font-weight:900;
    line-height:0.95;
    text-align:center;
    text-transform:uppercase;
  }

  .subtitulo{
    margin-top:3mm;
    font-size:18px;
    font-weight:900;
    line-height:1;
    text-align:center;
    text-transform:uppercase;
  }

  .codigo-barras{
    margin-top:4mm;
    width:100%;
    height:12mm;
    background:
      repeating-linear-gradient(
        90deg,
        #000 0px,
        #000 2px,
        #fff 2px,
        #fff 4px,
        #000 4px,
        #000 5px,
        #fff 5px,
        #fff 7px
      );
  }

  /* =======================
     LADO DERECHO
  ========================*/
  .lado-info{
    padding:5mm;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  .peso{
    font-size:22px;
    font-weight:900;
    margin-bottom:3mm;
  }

  .dato{
    font-size:13px;
    margin-bottom:2mm;
    line-height:1.2;
  }

  .dato strong{
    font-weight:900;
  }

  .frozen{
    margin-top:4mm;
    border-top:2px dashed #111;
    padding-top:3mm;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
  }

  .mini{
    margin-top:auto;
    font-size:9px;
    line-height:1.1;
    font-weight:700;
    opacity:.75;
  }

  @media print{
    html, body{
      width:200mm;
      height:80mm;
      overflow:hidden;
    }

    .etiqueta{
      break-inside:avoid;
    }
  }
</style>
</head>

<body>

<div class="etiqueta">

  <!-- IZQUIERDA -->
  <div class="lado-logo">
    <img src="logo.png" class="logo">

    <div class="empresa">
      Carnes y Vísceras del Centro
    </div>
  </div>

  <!-- CENTRO -->
  <div class="centro">

    <div class="tipo">
      PRODUCTO CONGELADO
    </div>

    <div class="titulo">
      CAJA DE<br>
      MENUDO
    </div>

    <div class="subtitulo">
      VÍSCERAS DEL CENTRO
    </div>

    <div class="codigo-barras"></div>

  </div>

  <!-- DERECHA -->
  <div class="lado-info">

    <div class="peso">20 KG</div>

    <div class="dato">
      <strong>FECHA:</strong><br>
      <span id="fecha"></span>
    </div>

    <div class="dato">
      <strong>LOTE:</strong><br>
      MEN-2026-001
    </div>

    <div class="dato">
      <strong>CÓDIGO:</strong><br>
      VDC-MEN-001
    </div>

    <div class="dato">
      <strong>EMPACADO:</strong><br>
      10:12 AM
    </div>

    <div class="frozen">
      CONSERVAR CONGELADO
    </div>

    <div class="mini">
      PRODUCTO DE RES<br>
      USO ALIMENTICIO
    </div>

  </div>

</div>

<script>
  const hoy = new Date();

  document.getElementById("fecha").textContent =
    hoy.toLocaleDateString("es-MX");
</script>

</body>
</html>
