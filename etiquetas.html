<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Etiqueta Menudo 200x80mm</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
  @page{
    size: 200mm 80mm;
    margin: 0;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    background:#fff;
    font-family:Arial, Helvetica, sans-serif;
  }

  body{
    width:200mm;
    height:80mm;
    overflow:hidden;
  }

  .etiqueta{
    width:200mm;
    height:80mm;
    border:3px solid #111;
    display:grid;
    grid-template-columns:55mm 1fr 60mm;
    overflow:hidden;
    background:#fff;
  }

  .lado-logo{
    padding:6mm 4mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:42mm;
    max-height:24mm;
    object-fit:contain;
    margin-bottom:4mm;
  }

  .empresa{
    font-size:12px;
    font-weight:900;
    line-height:1.1;
    text-transform:uppercase;
  }

  .centro{
    border-left:2px solid #111;
    border-right:2px solid #111;
    padding:4mm 5mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
  }

  .tipo{
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:2mm;
  }

  .titulo{
    font-size:28px;
    line-height:.95;
    font-weight:900;
  }

  .subtitulo{
    margin-top:3mm;
    font-size:18px;
    font-weight:900;
    line-height:1;
  }

  .barcode-wrap{
    margin-top:4mm;
    width:100%;
  }

  #barcode{
    width:100%;
    height:38px;
  }

  .barcode-text{
    margin-top:1mm;
    font-size:8px;
    font-weight:700;
    word-break:break-all;
    line-height:1.1;
  }

  .lado-info{
    padding:5mm;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  .peso{
    font-size:24px;
    font-weight:900;
    margin-bottom:4mm;
  }

  .dato{
    font-size:13px;
    margin-bottom:2.3mm;
    line-height:1.2;
  }

  .freeze{
    margin-top:3mm;
    padding-top:3mm;
    border-top:2px dashed #111;
    font-size:12px;
    font-weight:900;
  }

  .mini{
    margin-top:auto;
    font-size:9px;
    font-weight:700;
    line-height:1.1;
    opacity:.75;
  }

  @media print{
    html, body{
      width:200mm;
      height:80mm;
      overflow:hidden;
    }

    .etiqueta{
      page-break-inside:avoid;
      break-inside:avoid;
    }
  }
</style>
</head>

<body>

<div class="etiqueta">

  <div class="lado-logo">
    <img src="logo.png" class="logo">
    <div class="empresa">
      Carnes y Vísceras del Centro
    </div>
  </div>

  <div class="centro">
    <div class="tipo">PRODUCTO CONGELADO</div>

    <div class="titulo">
      CAJA DE<br>MENUDO
    </div>

    <div class="subtitulo">
      VÍSCERAS DEL CENTRO
    </div>

    <div class="barcode-wrap">
      <svg id="barcode"></svg>
      <div class="barcode-text" id="barcodeText"></div>
    </div>
  </div>

  <div class="lado-info">

    <div class="peso">
      20 KG
    </div>

    <div class="dato">
      <strong>FECHA:</strong><br>
      <span id="fecha"></span>
    </div>

    <div class="dato">
      <strong>LOTE:</strong><br>
      <span id="lote">MEN-2026-001</span>
    </div>

    <div class="dato">
      <strong>CÓDIGO:</strong><br>
      <span id="codigo">VDC-MEN-001</span>
    </div>

    <div class="dato">
      <strong>EMPACADO:</strong><br>
      <span id="hora"></span>
    </div>

    <div class="freeze">
      CONSERVAR CONGELADO
    </div>

    <div class="mini">
      PRODUCTO DE RES<br>
      USO ALIMENTICIO
    </div>

  </div>

</div>

<script>
  const peso = "20KG";
  const lote = "MEN-2026-001";
  const codigo = "VDC-MEN-001";

  const hoy = new Date();

  const fecha = hoy.toLocaleDateString("es-MX");

  const hora = hoy.toLocaleTimeString("es-MX", {
    hour:"2-digit",
    minute:"2-digit"
  });

  document.getElementById("fecha").textContent = fecha;
  document.getElementById("hora").textContent = hora;

  const barcodeData = `P:${peso}|F:${fecha}|L:${lote}|C:${codigo}`;

  document.getElementById("barcodeText").textContent = barcodeData;

  JsBarcode("#barcode", barcodeData, {
    format:"CODE128",
    lineColor:"#000",
    width:1.2,
    height:36,
    displayValue:false,
    margin:0
  });
</script>

</body>
</html>
